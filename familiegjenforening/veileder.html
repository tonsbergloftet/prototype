ardımcı olalım: [[KONTAKT: kontaktpunkt i kommunen]]{QA}", "kom_more": "Belediye sizi kimlerle bağlantıya geçirebilir?", "kom_one": "Yalnızca tek bir yerle iletişime geçmeniz yeterli. Oradan örneğin şu konularda yardım alabilirsiniz:", "kom_list": ["Çocuk sağlığı merkezi (helsestasjon)", "Öğrenim merkezi (Norveççe kursları)", "Anaokulu ve okul", "Aile hekimi (fastlege)"], "bank_label": "Bir sonraki darboğaz: banka ve BankID", "share_q": "Ailesini bekleyen birini tanıyor musunuz? Bu sayfayı paylaşın.", "share_btn": "Sayfayı paylaş", "copied": "Bağlantı kopyalandı", "og_desc": ""}, "nl": {"name": "Nederlands", "muni": "Gemeente Tønsberg", "title": "Drie dingen om te weten als je gezin komt", "intro": "Dit vinden veel gezinnen in het begin het moeilijkst. Bij elk punt zie je wat je zelf kunt doen en waar je hulp kunt krijgen.", "why": "Waarom dit moeilijk is", "pit": "Veelgemaakte fout", "do": "Doe dit nu", "help": "Hulp krijgen", "now": "Dit kunnen jullie nu doen", "wait": "Dit moet wachten op het identificatienummer", "more": "Lees meer", "less": "Minder tonen", "disclaimer": "Vervangt geen officiële informatie van UDI, NAV of de gemeente.", "proto": "Prototype – nog geen officiële dienst", "note": "Deze tekst is met hulp van AI uit het Noors vertaald en niet gecontroleerd door een vertaler. Er kan iets fout of onduidelijk zijn. Twijfel je? Vraag het dan aan de dienst waar het over gaat.", "kom_lead": "De gemeente weet vaak niet dat je gezin komt.", "kom_act": "Laat het ons weten, dan helpen we jullie op weg: [[KONTAKT: kontaktpunkt i kommunen]]{QA}", "kom_more": "Met wie kan de gemeente jullie in contact brengen?", "kom_one": "Je hoeft maar op één plek contact op te nemen. Van daaruit kun je verder geholpen worden met bijvoorbeeld:", "kom_list": ["Het consultatiebureau (helsestasjon)", "Het leercentrum (Noorse les)", "Kinderopvang en school", "Een huisarts (fastlege)"], "bank_label": "De volgende flessenhals: bank en BankID", "share_q": "Ken je iemand die op zijn of const POINTS={"no": [{"title": "Bestill time hos politiet tidlig", "short_why": "Fødselsnummer er første steg, og det kommer først etter timen hos politiet. Bank og BankID tar ofte tid etterpå.{QA}", "short_do": "Bestill time så tidlig som mulig, gjerne før familien kommer.", "why": "Vi ventet lenge på fødselsnummer, og uten det sto nesten alt stille.", "pit": "Mange venter med å bestille time til familien er i Norge. Da kan ventetiden bli lang, fordi det ofte er få ledige timer.{QA}", "do": "Les brevet fra UDI. Der står det om dere må bestille time selv, og hvem som må møte. Bestill time her: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Usikker på hva brevet betyr? Ring politiet på [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Mens dere venter på fødselsnummer", "short_why": "Bank, BankID, fastlege og søknader på nett må vente til fødselsnummeret er på plass.{QA}", "short_do": "Sett navnene til alle i familien på postkassen, så brevet med fødselsnummeret kommer fram.{QA}", "why": "Det føltes som om vi ikke kunne gjøre noe før nummeret kom.", "pit": "Navnene står ikke på postkassen, så viktige brev kommer ikke fram.{QA}", "do": "Sett navnene på postkassen i dag. Bruk så ventetiden på det som ikke trenger fødselsnummer.", "now": ["Kontakte skolen hvis dere har barn i skolealder", "Bruke legevakten (116 117) og helsestasjonen for barn under 6 år{QA}", "Spørre læringssenteret om norskopplæring", "Samle viktige papirer og ta bilder av dem"], "wait": ["Bankkonto og BankID", "Fastlege", "Barnetrygd og de fleste søknader på nett"], "bank_pit": "Banken kan be om flere dokumenter, og det kan ta tid før BankID er klar.{QA}", "bank_do": "Bestill time i banken så snart fødselsnummeret er kommet, og spør hvilke dokumenter dere må ha med.{QA}"}, {"title": "Bolig: start letingen tidlig", "short_why": "Det er vanskelig å finne en bolig som er stor nok, og køen for kommunal bolig er ofte lang.{QA}", "short_do": "Let selv samtidig som dere står i kø, og be om hjelp med språket hvis dere trenger det.", "why": "Vi bodde for trangt, og det var vanskelig å lete etter bolig uten å kunne norsk.", "pit": "Mange venter bare på kommunal bolig. Det kan ta lang tid, så det lønner seg å lete selv samtidig.{QA}", "steps": ["Se etter utleieboliger på finn.no. Et oversettelsesprogram kan hjelpe deg å lese annonsene.", "Søk om kommunal bolig samtidig: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Sjekk om dere kan få bostøtte: [[LENKE: bostøtte]]{QA}", "Trenger dere hjelp med språket, for eksempel for å ringe en utleier? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "en": [{"title": "Book a police appointment early", "short_why": "The ID number (fødselsnummer) is the first step, and it only comes after the police appointment. A bank account and BankID often take time after that.{QA}", "short_do": "Book an appointment as early as possible, ideally before the family arrives.", "why": "We waited a long time for the ID number, and without it almost everything was on hold.", "pit": "Many people wait to book until the family is in Norway. The wait can then be long, because there are often few available appointments.{QA}", "do": "Read the letter from UDI. It says whether you need to book an appointment yourselves and who has to attend. Book here: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Not sure what the letter means? Call the police on [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "While you wait for the ID number", "short_why": "A bank account, BankID, a GP and online applications have to wait until the ID number is in place.{QA}", "short_do": "Put the names of everyone in the family on the letterbox, so the letter with the ID number reaches you.{QA}", "why": "It felt like we couldn't do anything until the number came.", "pit": "The names are not on the letterbox, so important letters don't arrive.{QA}", "do": "Put the names on the letterbox today. Then use the waiting time for things that don't need an ID number.", "now": ["Contact the school if you have school-age children", "Use the out-of-hours medical service (legevakt, 116 117) and the child health clinic (helsestasjon) for children under 6{QA}", "Ask the learning centre about Norwegian classes", "Collect important documents and take photos of them"], "wait": ["Bank account and BankID", "GP (fastlege)", "Child benefit and most online applications"], "bank_pit": "The bank may ask for several documents, and it can take time before BankID is ready.{QA}", "bank_do": "Book an appointment at the bank as soon as the ID number arrives, and ask which documents to bring.{QA}"}, {"title": "Housing: start looking early", "short_why": "It is hard to find a home that is big enough, and the queue for municipal housing is often long.{QA}", "short_do": "Look for a home yourselves while you wait in the queue, and ask for help with the language if you need it.", "why": "We lived in too small a space, and it was hard to look for a home without speaking Norwegian.", "pit": "Many people only wait for municipal housing. That can take a long time, so it pays to look yourselves at the same time.{QA}", "steps": ["Look for homes to rent on finn.no. A translation app can help you read the ads.", "Apply for municipal housing at the same time: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Check whether you can get housing allowance (bostøtte): [[LENKE: bostøtte]]{QA}", "Need help with the language, for example to call a landlord? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "ar": [{"title": "احجز موعداً لدى الشرطة مبكراً", "short_why": "رقم الهوية النرويجي (fødselsnummer) هو الخطوة الأولى، ولا يصدر إلا بعد موعد الشرطة. وغالباً ما يستغرق الحساب البنكي وBankID وقتاً بعد ذلك.{QA}", "short_do": "احجز الموعد في أقرب وقت ممكن، ويُفضَّل قبل وصول العائلة.", "why": "انتظرنا طويلاً للحصول على رقم الهوية، ومن دونه توقّف كل شيء تقريباً.", "pit": "كثيرون ينتظرون وصول العائلة إلى النرويج قبل حجز الموعد. وقد يطول الانتظار حينها، لأن المواعيد المتاحة قليلة في أغلب الأحيان.{QA}", "do": "اقرأ رسالة UDI. ستجد فيها ما إذا كان عليكم حجز الموعد بأنفسكم، ومن يجب أن يحضر. احجز الموعد هنا: [[LENKE: timebestilling hos politiet]]{QA}", "help": "لست متأكداً مما تعنيه الرسالة؟ اتصل بالشرطة على [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "أثناء انتظار رقم الهوية", "short_why": "الحساب البنكي وBankID والطبيب العام والطلبات عبر الإنترنت يجب أن تنتظر حتى يصدر رقم الهوية.{QA}", "short_do": "اكتبوا أسماء جميع أفراد العائلة على صندوق البريد، حتى تصلكم رسالة رقم الهوية.{QA}", "why": "شعرنا وكأننا لا نستطيع فعل أي شيء قبل وصول الرقم.", "pit": "الأسماء غير مكتوبة على صندوق البريد، فلا تصل الرسائل المهمة.{QA}", "do": "اكتبوا الأسماء على صندوق البريد اليوم. ثم استفيدوا من وقت الانتظار في الأمور التي لا تحتاج إلى رقم الهوية.", "now": ["التواصل مع المدرسة إذا كان لديكم أطفال في سن المدرسة", "استخدام الطوارئ الطبية (legevakt) على 116 117 ومركز صحة الطفل (helsestasjon) للأطفال دون 6 سنوات{QA}", "السؤال في مركز التعلّم عن دروس اللغة النرويجية", "جمع الوثائق المهمة وتصويرها"], "wait": ["الحساب البنكي وBankID", "الطبيب العام (fastlege)", "إعانة الأطفال ومعظم الطلبات عبر الإنترنت"], "bank_pit": "قد يطلب البنك عدة وثائق، وقد يستغرق تجهيز BankID بعض الوقت.{QA}", "bank_do": "احجزوا موعداً في البنك فور وصول رقم الهوية، واسألوا عن الوثائق التي يجب إحضارها.{QA}"}, {"title": "السكن: ابدأوا البحث مبكراً", "short_why": "من الصعب إيجاد مسكن كبير بما يكفي، وقائمة الانتظار للسكن البلدي طويلة في الغالب.{QA}", "short_do": "ابحثوا بأنفسكم أثناء انتظاركم في القائمة، واطلبوا المساعدة في اللغة إذا احتجتم إليها.", "why": "كنا نعيش في مكان ضيق، وكان البحث عن مسكن صعباً من دون معرفة اللغة النرويجية.", "pit": "كثيرون يكتفون بانتظار السكن البلدي. قد يستغرق ذلك وقتاً طويلاً، لذا من الأفضل البحث بأنفسكم في الوقت نفسه.{QA}", "steps": ["ابحثوا عن مساكن للإيجار على موقع finn.no. يمكن لتطبيق ترجمة أن يساعدكم على قراءة الإعلانات.", "قدّموا طلباً للسكن البلدي في الوقت نفسه: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "تحقّقوا مما إذا كان يحق لكم الحصول على دعم السكن (bostøtte): [[LENKE: bostøtte]]{QA}", "هل تحتاجون إلى مساعدة في اللغة، مثلاً للاتصال بمؤجّر؟ [[STED: hvor man kan få språkhjelp]]{QA}"]}], "tr": [{"title": "Polisten erken randevu alın", "short_why": "Kimlik numarası (fødselsnummer) ilk adımdır ve ancak polis randevusundan sonra verilir. Banka hesabı ve BankID de çoğu zaman sonrasında zaman alır.{QA}", "short_do": "Mümkün olduğunca erken, tercihen aile gelmeden önce randevu alın.", "why": "Kimlik numarasını uzun süre bekledik ve o olmadan neredeyse her şey durdu.", "pit": "Birçok kişi randevu almak için ailenin Norveç'e gelmesini bekler. O zaman bekleme süresi uzayabilir, çünkü boş randevu genellikle azdır.{QA}", "do": "UDI'nin mektubunu okuyun. Randevuyu sizin alıp almayacağınız ve kimlerin gelmesi gerektiği mektupta yazar. Randevuyu buradan alın: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Mektubun ne anlama geldiğinden emin değil misiniz? Polisi arayın: [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Kimlik numarasını beklerken", "short_why": "Banka, BankID, aile hekimi ve internet başvuruları kimlik numarası gelene kadar beklemek zorunda.{QA}", "short_do": "Kimlik numarasının yazdığı mektubun ulaşması için ailedeki herkesin adını posta kutusuna yazın.{QA}", "why": "Numara gelene kadar hiçbir şey yapamıyormuşuz gibi hissettik.", "pit": "İsimler posta kutusunda yazmıyor, bu yüzden önemli mektuplar ulaşmıyor.{QA}", "do": "İsimleri bugün posta kutusuna yazın. Sonra bekleme süresini kimlik numarası gerektirmeyen işler için kullanın.", "now": ["Okul çağında çocuğunuz varsa okulla iletişime geçmek", "Acil sağlık hizmetini (legevakt, 116 117) ve 6 yaşından küçük çocuklar için çocuk sağlığı merkezini (helsestasjon) kullanmak{QA}", "Öğrenim merkezine Norveççe kurslarını sormak", "Önemli belgeleri toplayıp fotoğraflarını çekmek"], "wait": ["Banka hesabı ve BankID", "Aile hekimi (fastlege)", "Çocuk yardımı ve internet başvurularının çoğu"], "bank_pit": "Banka birçok belge isteyebilir ve BankID'nin hazır olması zaman alabilir.{QA}", "bank_do": "Kimlik numarası gelir gelmez bankadan randevu alın ve hangi belgeleri getirmeniz gerektiğini sorun.{QA}"}, {"title": "Konut: aramaya erken başlayın", "short_why": "Yeterince büyük bir ev bulmak zordur ve belediye konutu sırası genellikle uzundur.{QA}", "short_do": "Sırada beklerken kendiniz de arayın ve gerekirse dil konusunda yardım isteyin.", "why": "Çok dar bir yerde yaşıyorduk ve Norveççe bilmeden ev aramak zordu.", "pit": "Birçok kişi yalnızca belediye konutunu bekler. Bu uzun sürebilir; bu yüzden aynı anda kendiniz de aramanız faydalı olur.{QA}", "steps": ["finn.no'da kiralık ev arayın. İlanları okumak için bir çeviri uygulaması kullanabilirsiniz.", "Aynı anda belediye konutu için başvurun: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Konut yardımı (bostøtte) alıp alamayacağınızı kontrol edin: [[LENKE: bostøtte]]{QA}", "Dil konusunda yardıma mı ihtiyacınız var, örneğin bir ev sahibini aramak için? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "nl": [{"title": "Maak vroeg een afspraak bij de politie", "short_why": "Het identificatienummer (fødselsnummer) is de eerste stap, en je krijgt het pas na de afspraak bij de politie. Een bankrekening en BankID kosten daarna vaak ook tijd.{QA}", "short_do": "Maak zo vroeg mogelijk een afspraak, het liefst voordat het gezin komt.", "why": "We hebben lang op het identificatienummer gewacht, en zonder dat lag bijna alles stil.", "pit": "Veel mensen wachten met boeken tot het gezin in Noorwegen is. Dan kan de wachttijd lang worden, omdat er vaak weinig afspraken vrij zijn.{QA}", "do": "Lees de brief van UDI. Daarin staat of jullie zelf een afspraak moeten maken en wie er moet komen. Maak hier een afspraak: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Weet je niet zeker wat de brief betekent? Bel de politie: [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Terwijl jullie wachten op het identificatienummer", "short_why": "Bank, BankID, huisarts angler vaksiner", "for": "Barn og unge", "when": "Første måned", "need": "Vaksinasjonskort hvis dere har det", "why": "Noen barn kan mangle vaksiner fra det norske vaksinasjonsprogrammet. Helsestasjonen hjelper med å finne ut hva som mangler.", "desc": "Ta med vaksinasjonskortet til helsestasjonen eller skolehelsetjenesten.", "call": "", "link": "", "id": "vaccines", "kids": true}, {"type": "smart", "title": "Tannhelse for barn", "for": "Barn og unge", "when": "De første månedene", "need": "—", "why": "Barn og unge får gratis tannbehandling i den offentlige tannhelsetjenesten til og med året de fyller 18.", "desc": "Tannklinikken kaller som regel inn barna selv, første gang rundt treårsalderen. Har barnet vondt i tennene, ta kontakt med en gang.", "call": "", "link": "https://www.tonsberg.kommune.no/tannhelse", "id": "teeth", "kids": true}], "short": "Helse", "title": "Helse og fastlege", "sub": "Fastlege og helsehjelp."}, {"id": "kids", "items": [{"type": "first", "title": "Meld barnet på skolen", "for": "Barn 6–16 år", "when": "Så snart som mulig", "need": "Barnets alder og adresse. Skolepapirer fra hjemlandet hvis dere har det.", "why": "Barn i grunnskolealder har rett til skolegang i Norge, og etter tre måneder også plikt. Skolen er gratis.", "desc": "Kontakt kommunen eller nærmeste skole for å finne riktig plass. Du kan spørre om de har en klasse for barn som nylig har kommet til Norge.", "call": "Ring skolen og si: «Jeg har et barn i skolealder som nettopp har kommet til Norge. Jeg vil gjerne melde barnet på skolen.»", "link": "https://www.tonsberg.kommune.no/skole", "svc": true, "id": "school", "kids": true}, {"type": "smart", "title": "Søk SFO", "for": "Barn på 1.–4. trinn", "when": "Sammen med skoleinnmeldingen", "need": "—", "why": "SFO er et tilbud før og etter skoletid. Det gjør det lettere for foreldre å jobbe eller gå på norskkurs.", "desc": "Familier med lav inntekt kan ha rett til lavere pris. Mange søker ikke selv om de har rett – sjekk kommunens side.", "call": "", "link": "https://www.tonsberg.kommune.no/sfo", "id": "sfo", "kids": true}, {"type": "first", "title": "Søk barnehageplass", "for": "Barn 1–5 år", "when": "Så snart som mulig", "need": "Barnets fødselsdato og adresse", "why": "Det er begrenset med plasser og faste søknadsfrister.", "desc": "Søk på kommunens nettside. Sjekk søknadsfristen.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg", "stuck": "Får dere ikke søkt på nett uten innlogging, eller er dere usikre på svaret? Spør her: [[KONTAKT: barnehageopptak i kommunen]]{QA}", "kids": true}, {"type": "smart", "title": "Sjekk om dere kan få lavere pris eller gratis timer i barnehagen", "for": "Barn i barnehage – familier med lav inntekt", "when": "Når dere har fått barnehageplass", "need": "Dokumentasjon på inntekt", "why": "Familier med lav inntekt kan ha rett til lavere pris, og barn fra 2 år kan få 20 timer gratis per uke.", "desc": "Søk hos kommunen. Mange søker ikke selv om de har rett – sjekk hva som gjelder dere.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg-price", "kids": true}], "short": "Barn", "title": "Barn og skole", "sub": "For familier med barn."}, {"id": "money", "items": [{"type": "maybe", "title": "Søk om barnetrygd", "for": "Familier med barn under 18 år", "when": "Kort tid etter ankomst", "need": "Norsk ID-nummer, dokumentasjon på barna og adresse", "why": "Barnetrygd er penger fra Nav for barn under 18 år som bor i Norge. Den kommer ikke automatisk – du må søke.", "desc": "Sjekk vilkårene og søk på nav.no/barnetrygd. Du kan også ringe Nav og få hjelp.", "call": "Ring Nav på 55 55 33 33 og si: «Barna mine har nettopp kommet til Norge. Jeg vil søke barnetrygd.»", "link": "https://www.nav.no/barnetrygd", "svc": true, "id": "barnetrygd", "kids": true}], "short": "Penger", "title": "Barnetrygd", "sub": "Penger fra Nav for barn under 18 år."}, {"id": "norsk", "items": [{"type": "maybe", "title": "Sjekk om noen i familien kan eller må delta i introduksjonsprogrammet", "for": "Avhenger av oppholdsgrunnlag", "when": "De første ukene", "need": "Brevet fra UDI", "why": "Introduksjonsprogrammet gir opplæring, stønad og oppfølging. Hvor lenge det varer, avhenger av situasjonen. Målet er jobb eller utdanning.", "desc": "Kontakt Tønsberg læringssenter for å høre hva som gjelder for familien din.", "call": "Ring læringssenteret og si: «Familien min har nettopp kommet til Norge på familiegjenforening. Kan eller må vi delta i introduksjonsprogrammet?»", "link": "https://www.tonsberg.kommune.no/laringssenteret", "svc": true, "id": "intro"}, {"type": "first", "title": "Start norskopplæring", "for": "Voksne", "when": "Så snart som mulig", "need": "Norsk ID-nummer", "why": "Norsk gjør det lettere å få jobb, klare seg selv og bli kjent med folk. Mange har rett til gratis norskopplæring, og noen har plikt.", "desc": "Tønsberg læringssenter tilbyr norskopplæring. Spør hva som gjelder for deg, og hvordan du melder deg på.", "call": "Ring læringssenteret og si: «Jeg vil gjerne begynne på norskopplæring. Hva er neste steg?»", "link": "https://www.tonsberg.kommune.no/laringssenteret", "svc": true, "id": "norsk"}, {"type": "smart", "title": "Lag en plan for arbeid og utdanning", "for": "Voksne", "when": "Når de viktigste tingene er ordnet", "need": "—", "why": "Å komme i jobb eller utdanning er viktig for økonomi, hverdagsliv og integrering.", "desc": "Nav og læringssenteret kan hjelpe med å kartlegge utdanning og arbeidserfaring fra hjemlandet, og vise vei videre.", "call": "", "link": "https://www.nav.no", "id": "plan"}], "short": "Norsk", "title": "Norsk og arbeid", "sub": "Neste steg når det praktiske er på plass."}], "en": [{"id": "key", "items": [{"id": "kommune", "type": "key", "title": "Let the municipality know that your family is coming", "for": "Everyone", "when": "As early as possible", "need": "—", "why": "The municipality often does not know that the family is coming. When you let them know, you can get help with the next steps.{QA}", "do": "Get in touch here: [[KONTAKT: kontaktpunkt i kommunen]]. You only need to contact one place.{QA}", "call": "", "link": ""}, {"id": "police", "type": "key", "title": "Book a police appointment early", "for": "Everyone", "when": "Ideally before the family arrives", "need": "Passport and the letter from UDI", "why": "The ID number (fødselsnummer) is the first step, and it only comes after the police appointment. A bank account and BankID often take time after that.{QA}", "pit": "Many people wait to book until the family is in Norway. The wait can then be long, because there are often few available appointments.{QA}", "do": "Read the letter from UDI. It says whether you need to book an appointment yourselves and who has to attend. Book here: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Not sure what the letter means? Call the police on [[TELEFON: politiet, utlendingsavdelingen]].", "call": "", "link": ""}, {"id": "housing", "type": "key", "title": "Housing: start looking early", "for": "Everyone", "when": "As early as possible", "need": "—", "why": "It is hard to find a home that is big enough, and the queue for municipal housing is often long.{QA}", "pit": "Many people only wait for municipal housing. That can take a long time, so it pays to look yourselves at the same time.{QA}", "steps": ["Look for homes to rent on finn.no. A translation app can help you read the ads.", "Apply for municipal housing at the same time: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Check whether you can get housing allowance (bostøtte): [[LENKE: bostøtte]]{QA}", "Need help with the language, for example to call a landlord? [[STED: hvor man kan få språkhjelp]]{QA}"], "call": "", "link": "", "housing": true}], "short": "Key", "title": "Most important first", "sub": "These take the longest. Start here."}, {"id": "before", "items": [{"type": "first", "title": "Read the letter from UDI", "for": "Everyone", "when": "As soon as you receive it", "need": "The letter from UDI", "why": "The letter says when the family can travel, how long the permit lasts, and what the family must do to get a residence card.", "desc": "Write down when the family can travel and when the permit expires. If the permit can be renewed, you must apply no later than one month before it expires.", "call": "Tell the family: 'You can travel to Norway from [date]. Bring all the documents listed in the letter.'", "link": "https://www.udi.no", "id": "udi"}, {"type": "first", "title": "Collect important documents", "for": "Everyone", "when": "Before the family packs", "need": "Passports, the letter from UDI, birth certificates, vaccination records, school papers, prescriptions", "why": "Documents can be difficult to get hold of later.", "desc": "Bring originals where possible. Photograph all documents and store the images safely – for example in cloud storage.", "call": "", "link": "", "id": "docs"}, {"type": "smart", "title": "Apply early for a kindergarten place (barnehage)", "for": "Children aged 1–5", "when": "Now", "need": "Child's date of birth and home address", "why": "Kindergarten places are allocated according to fixed application deadlines. Check the municipality's deadline so you don't miss it.", "desc": "Children living in Tønsberg may be entitled to a kindergarten place. Ask the municipality what applies to you.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg-early", "kids": true}], "short": "Before", "title": "Before the family arrives", "sub": "Things you can do while the family is on the way."}, {"id": "week1", "items": [{"type": "first", "title": "Attend the police appointment", "for": "Everyone", "when": "At the appointment you have been given", "need": "Passport, the letter from UDI and all documents listed in the letter", "why": "The family needs a residence card to use most public services in Norway.", "desc": "Follow what the letter says about who must attend. Children under 18 must be accompanied by a parent.{QA}", "call": "", "link": "", "id": "police-attend"}, {"type": "first", "title": "Look out for a letter with a Norwegian ID number", "for": "Everyone", "when": "About 2 weeks after the police appointment", "need": "Everyone's names on the letterbox", "why": "With a Norwegian ID number (national identity number – fødselsnummer – or D number), the family can get a doctor, a bank account, a school place and most public services.", "desc": "Most people who come through family reunification are registered automatically in the National Population Register (Folkeregisteret) and receive a letter from the Tax Administration (Skatteetaten). If someone gets a D number, or no letter arrives, contact Skatteetaten.{QA}", "call": "Call Skatteetaten on 800 80 000 and say: 'My family has come to Norway through family reunification. We have not received a letter with a national identity number.'", "link": "https://www.skatteetaten.no/person/folkeregister/flytte/til-norge/", "svc": true, "id": "id-letter"}, {"type": "first", "title": "Bank account and BankID", "for": "Adults with a Norwegian ID number", "when": "Right after the ID number arrives", "need": "Passport and Norwegian ID number", "why": "You need a bank account for wages and support, and BankID for Helsenorge and many other services. This is often the next bottleneck.{QA}", "pit": "The bank may ask for several documents, and it can take time before BankID is ready.{QA}", "do": "Book an appointment at the bank as soon as the ID number arrives, and ask which documents to bring. You can create MinID yourself at minid.no, but it does not work for Helsenorge.", "call": "", "link": "https://www.minid.no", "id": "bank-id", "stuck": "Can't open an account, or is BankID stuck? Ask here: [[KONTAKT: hjelp med bank og BankID]]{QA}"}, {"type": "urgent", "title": "Tuberculosis check-up", "for": "Some countries – check if this applies", "when": "As soon as possible after arrival", "need": "Passport", "why": "People who come from countries with a lot of tuberculosis and will stay in Norway for more than three months must have a check-up. This is required by law, and it is free.", "desc": "Tønsberg legekontor (the municipal doctors' office) is responsible for the check-up and may contact you. If you hear nothing, call Tønsberg legekontor on 33 29 25 99 (8:30–11:30 and 12:45–14:00). If you can't get through, try Re child health clinic (Re helsestasjon) on 33 40 69 40.", "call": "Call Tønsberg legekontor on 33 29 25 99 and say: 'My family has just arrived in Norway. Do they need a tuberculosis check-up, and when can we come?'", "link": "https://www.fhi.no/ss/tuberkulose/rutinemessig-undersokelse-av-tuberkulose/", "svc": true, "id": "tb"}], "short": "Week 1", "title": "The first days", "sub": "The most important things right after the family arrives."}, {"id": "health", "items": [{"type": "first", "title": "Choose a GP (fastlege)", "for": "Everyone with a national identity number", "when": "Once you have a national identity number", "need": "National identity number (fødselsnummer)", "why": "The GP is the doctor you contact when you are ill, need a prescription, or need a referral to a specialist.", "desc": "You can choose a GP at helsenorge.no, but this requires BankID. If you don't have BankID yet, you can call the GP helpline. Choose a practice near you. People with a D number are usually not entitled to a GP.", "call": "Call 810 59 500 and say: 'My family has just arrived in Norway. We would like to choose a GP.'", "link": "https://www.helsenorge.no/velg-fastlege/", "svc": true, "id": "fastlege", "stuck": "No GP yet, or told that the list is full? Call the GP helpline on 810 59 500, or ask here: [[KONTAKT: hjelp med fastlege]]{QA}"}, {"type": "first", "title": "Call the child health clinic (helsestasjon)", "for": "Children aged 0–5", "when": "In the first weeks", "need": "Child's health documents and vaccination record", "why": "The child health clinic follows up the child's health, development and vaccinations. It is free and voluntary, but strongly recommended.", "desc": "Call the child health clinic nearest to where you live: Sentrum 33 40 69 60, Slagen 33 34 84 60 or Re 33 40 69 40. They will give you an appointment.", "call": "Call the child health clinic and say: 'I have a young child who has just arrived in Norway. We would like an appointment.'", "link": "https://www.tonsberg.kommune.no/helsestasjon", "svc": true, "id": "helsestasjon", "kids": true}, {"type": "maybe", "title": "Check whether the child is missing any vaccinations", "for": "Children and young people", "when": "First month", "need": "Vaccination record if you have one", "why": "Some children may be missing vaccinations from the Norwegian programme. The child health clinic can help you find out what is missing.", "desc": "Bring the vaccination record to the child health clinic or the school health service.", "call": "", "link": "", "id": "vaccines", "kids": true}, {"type": "smart", "title": "Dental care for children", "for": "Children and young people", "when": "In the first months", "need": "—", "why": "Children and young people get free dental care in the public dental service up to the end of the year they turn 18.", "desc": "The dental clinic usually calls children in, the first time at around age three. If the child has toothache, get in touch straight away.", "call": "", "link": "https://www.tonsberg.kommune.no/tannhelse", "id": "teeth", "kids": true}], "short": "Health", "title": "Health and GP", "sub": "GP and health services."}, {"id": "kids", "items": [{"type": "first", "title": "Enrol the child in school", "for": "Children aged 6–16", "when": "As soon as possible", "need": "Child's age and address. School papers from the home country if you have them.", "why": "Children of compulsory school age have the right to go to school in Norway, and after three months it is also compulsory. School is free.", "desc": "Contact the municipality or the nearest school to find the right place. You can ask if they have a class for children who have recently arrived in Norway.", "call": "Call the school and say: 'I have a school-age child who has just arrived in Norway. I would like to enrol them.'", "link": "https://www.tonsberg.kommune.no/skole", "svc": true, "id": "school", "kids": true}, {"type": "smart", "title": "Apply for before- and after-school care (SFO)", "for": "Children in years 1–4", "when": "When enrolling in school", "need": "—", "why": "SFO is care before and after school hours. It makes it easier for parents to work or attend Norwegian classes.", "desc": "Families with a low income may be entitled to a lower price. Many don't apply even though they qualify – check the municipality's page.", "call": "", "link": "https://www.tonsberg.kommune.no/sfo", "id": "sfo", "kids": true}, {"type": "first", "title": "Apply for a kindergarten place (barnehage)", "for": "Children aged 1–5", "when": "As soon as possible", "need": "Child's date of birth and address", "why": "Places are limited and there are fixed application deadlines.", "desc": "Apply on the municipality's website. Check the application deadline.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg", "stuck": "Can't apply online without logging in, or unsure about the answer you got? Ask here: [[KONTAKT: barnehageopptak i kommunen]]{QA}", "kids": true}, {"type": "smart", "title": "Check for a lower price or free hours in kindergarten", "for": "Children in kindergarten – low-income families", "when": "Once you have a kindergarten place", "need": "Proof of income", "why": "Low-income families may be entitled to a lower price, and children from age 2 can get 20 free hours a week.", "desc": "Apply to the municipality. Many don't apply even though they qualify – check what applies to you.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg-price", "kids": true}], "short": "Children", "title": "Children and school", "sub": "For families with children."}, {"id": "money", "items": [{"type": "maybe", "title": "Apply for child benefit (barnetrygd)", "for": "Families with children under 18", "when": "Shortly after arrival", "need": "Norwegian ID number, documents for the children and address", "why": "Child benefit (barnetrygd) is money from Nav for children under 18 who live in Norway. It is not paid automatically – you must apply.", "desc": "Check the conditions and apply at nav.no/barnetrygd. You can also call Nav for help.", "call": "Call Nav on 55 55 33 33 and say: 'My children have just arrived in Norway. I would like to apply for child benefit.'", "link": "https://www.nav.no/barnetrygd", "svc": true, "id": "barnetrygd", "kids": true}], "short": "Money", "title": "Child benefit", "sub": "Money from Nav for children under 18."}, {"id": "norsk", "items": [{"type": "maybe", "title": "Check whether anyone in the family can or must take part in the introduction programme", "for": "Depends on your permit type", "when": "In the first weeks", "need": "The letter from UDI", "why": "The introduction programme offers training, financial support and follow-up. How long it lasts depends on your situation. The goal is work or education.", "desc": "Contact Tønsberg learning centre (Tønsberg læringssenter) to find out what applies to your family.", "call": "Call the learning centre and say: 'My family has just come to Norway through family reunification. Can we or must we take part in the introduction programme?'", "link": "https://www.tonsberg.kommune.no/laringssenteret", "svc": true, "id": "intro"}, {"type": "first", "title": "Start learning Norwegian", "for": "Adults", "when": "As soon as possible", "need": "Norwegian ID number", "why": "Norwegian makes it easier to find work, manage on your own and get to know people. Many people have the right to free Norwegian classes, and some are required to attend.", "desc": "Tønsberg learning centre offers Norwegian classes. Ask what applies to you and how to sign up.", "call": "Call the learning centre and say: 'I would like to start learning Norwegian. What is the next step?'", "link": "https://www.tonsberg.kommune.no/laringssenteret", "svc": true, "id": "norsk"}, {"type": "smart", "title": "Make a plan for work and education", "for": "Adults", "when": "Once the most important things are sorted", "need": "—", "why": "Getting into work or education is important for your finances, daily life and integration.", "desc": "Nav and the learning centre can help map your education and work experience from your home country, and show you the next steps.", "call": "", "link": "https://www.nav.no", "id": "plan"}], "short": "Norwegian", "title": "Norwegian and work", "sub": "Next steps once the practical things are in place."}], "ar": [{"id": "key", "items": [{"id": "kommune", "type": "key", "title": "أخبروا البلدية بأن العائلة قادمة", "for": "الجميع", "when": "في أقرب وقت ممكن", "need": "—", "why": "في كثير من الأحيان لا تعرف البلدية أن العائلة قادمة. عندما تخبرونها، يمكنكم الحصول على المساعدة في الخطوات التالية.{QA}", "do": "تواصلوا هنا: [[KONTAKT: kontaktpunkt i kommunen]]. تحتاجون إلى التواصل مع جهة واحدة فقط.{QA}", "call": "", "link": ""}, {"id": "police", "type": "key", "title": "احجز موعداً لدى الشرطة مبكراً", "for": "الجميع", "when": "يُفضَّل قبل وصول العائلة", "need": "جواز السفر ورسالة UDI", "why": "رقم الهوية النرويجي (fødselsnummer) هو الخطوة الأولى، ولا يصدر إلا بعد موعد الشرطة. وغالباً ما يستغرق الحساب البنكي وBankID وقتاً بعد ذلك.{QA}", "pit": "كثيرون ينتظرون وصول العائلة إلى النرويج قبل حجز الموعد. وقد يطول الانتظار حينها، لأن المواعيد المتاحة قليلة في أغلب الأحيان.{QA}", "do": "اقرأ رسالة UDI. ستجد فيها ما إذا كان عليكم حجز الموعد بأنفسكم، ومن يجب أن يحضر. احجز الموعد هنا: [[LENKE: timebestilling hos politiet]]{QA}", "help": "لست متأكداً مما تعنيه الرسالة؟ اتصل بالشرطة على [[TELEFON: politiet, utlendingsavdelingen]].", "call": "", "link": ""}, {"id": "housing", "type": "key", "title": "السكن: اب ّق من الموعد النهائي لدى البلدية حتى لا يفوتك.", "desc": "قد يحق للأطفال المقيمين في تونسبرغ الحصول على مكان في الروضة. اسأل البلدية عمّا ينطبق عليكم.", "call": "", "link": "https://www.tonsberg.kommune.no/barnehage", "id": "bhg-early", "kids": true}], "short": "قبل", "title": "قبل وصول العائلة", "sub": "أمور يمكنك فعلها بينما العائلة في الطريق."}, {"id": "week1", "items": [{"type": "first", "title": "احضروا موعد الشرطة", "for": "الجميع", "when": "في الموعد المحدد لكم", "need": "جواز السفر ورسالة UDI وجميع الوثائق المذكورة فيها", "why": "تحتاج العائلة إلى بطاقة الإقامة لاستخدام معظم الخدمات العامة في النرويج.", "desc": "اتّبعوا ما تقوله الرسالة بشأن من يجب أن يحضر. يجب أن يرافق الأطفالَ دون <span dir=\"ltr\">18</span> عاماً أحدُ الوالدين.{QA}", "call": "", "link": "", "id": "police-attend"}, {"type": "first", "title": "انتظر الرسالة الخاصة برقم الهوية النرويجي", "for": "الجميع", "when": "بعد نحو أسبوعين من موعد الشرطة", "need": "أسماء الجميع على صندوق البريد", "why": "برقم الهوية النرويجي (fødselsnummer أو D-nummer) يمكن للعائلة الحصول على طبيب وحساب بنكي ومكان في المدرسة ومعظم الخدمات العامة.", "desc": "معظم القادمين عبر لمّ الشمل يُسجَّلون تلقائياً في سجل السكان (Folkeregisteret) وتصلهم رسالة من مصلحة الضرائب (Skatteetaten). إذا حصل أحدهم على D-nummer أو لم تصل أي رسالة، فتواصلوا مع Skatteetaten.{QA}", "call": "اتصل بمصلحة الضرائب (Skatteetaten) على الرقم <span dir=\"ltr\">800 80 000</span> وقل: «وصلت عائلتي إلى النرويج عبر لمّ الشمل. لم نستلم رسالة برقم الهوية.»", "link": "https://www.skatteetaten.no/person/folkeregister/flytte/til-norge/", "svc": true, "id": "id-letter"}, {"type": "first", "title": "الحساب البنكي وBankID", "for": "البالغون الذين لديهم رقم هوية نرويجي", "when": "فور وصول رقم الهوية", "need": "جواز السفر ورقم الهوية النرويجي", "why": "تحتاجون إلى حساب بنكي لاستلام الراتب والدعم، وإلى BankID لموقع Helsenorge وخدمات كثيرة أخرى. وغالباً ما يكون هذا العقبة التالية.{QA}", "pit": "قد يطلب البنك عدة وثائق، وقد يستغرق تجهيز BankID بعض الوقت.{QA}", "do": "  kan helpen om de advertenties te lezen.", "Vraag tegelijk een gemeentewoning aan: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Check of jullie huurtoeslag (bostøtte) kunnen krijgen: [[LENKE: bostøtte]]{QA}", "Hulp nodig met de taal, bijvoorbeeld om een verhuurder te bellen? [[STED: hvor man kan få språkhjelp]]{QA}"], "call": "", "link": "", "housing": true}], "short": "Belangrijk", "title": "Het belangrijkste eerst", "sub": "Dit duurt het langst. Begin hier."}, {"id": "before", "items": [{"type": "first", "title": "Lees de brief van UDI", "for": "Iedereen", "when": "Zodra je hem ontvangt", "need": "De brief van UDI", "why": "In de brief staat wanneer het gezin kan reizen, hoe lang de vergunning geldig is en wat het gezin moet doen om een verblijfskaart te krijgen.", "desc": "Noteer wanneer het gezin kan reizen en wanneer de vergunning afloopt. Als de vergunning verlengd kan worden, moet je uiterlijk één maand voor de einddatum verlenging aanvragen.", "call": "Vertel het gezin: 'Jullie kunnen vanaf [datum] naar Noorwegen reizen. Neem alle documenten mee die in de brief staan.'", "link": "https://www.udi.no", "id": "udi"}, {"type": "first", "title": "Verzamel belangrijke documenten", "for": "Iedereen", "when": "Voordat het gezin inpakt", "need": "Paspoorten, brief van UDI, geboorteakten, vaccinatiekaarten, schoolpapieren, recepten", "why": "Documenten zijn later vaak moeilijk te krijgen.", "desc": "Neem originelen mee waar mogelijk. Fotografeer alle documenten en bewaar de foto's veilig – bijvoorbeeld in de cloud.", "call": "", "link": "", "id": "docs"}, {"type": "smart", "title": "Vraag vroeg een plek aan in de kinderopvang (barnehage)", "for": "Kinderen van 1–5 jaar", "when": "Nu al", "need": "Geboortedatum en woonadres van het kind", "why": "Plekken in de kinderopvang worden verdeeld volgens vaste aanmeldtermijnen. Check de termijn van de gemeente, zodat je die niet mist.", "desc": "Kinderen die in Tønsberg wonen, kunnen recht hebben op een plek. Vraag de function fmt(s){
  s=s.replace(/\{QA\}/g,'<span class="qa" lang="nb" dir="ltr">[MÅ KVALITETSSIKRES]</span>')

function appUrl(){ const u=new URL(location.href); u.hash=''; u.search='?lang='+state.lang; return u.href; }
async function share(btn, label, done, title){
  const url=appUrl();
  if(navigator.share){ try{ await navigator.share({title, url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); btn.textContent=done; setTimeout(()=>btn.textContent=label,2000); }catch(e){ prompt('', url); }
}

function route(){
  let r=location.hash.slice(1);
  if(!state.lang) r='sprak';
  else if(!['sprak','hjem','sporsmal','liste'].includes(r)) r='hjem';
  if(r==='liste' && !state.answered) r='sporsmal';
  return r;
}

  sw.innerHTML=LANGS.map(x=>`<button data-l="${x}" aria-pressed="${x===l}" title="${NAMES[x]}">${x.toUpperCase()}</button>`).join('');
  sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.lang=b.dataset.l; save(); render(); });
  const fl=document.getElementById('footLinks'); fl.hidden = r!=='liste';
  document.getElementById('change').textContent=CUI[l].change;
  document.getElementById('restart').textContent=CUI[l].restart;
}

function screenLang(){
  return `<section class="langpick"><h1>${APP.no.pick}</h1><p class="picks">${LANGS.slice(1).map(l=>`<span lang="${l}" dir="${l==='ar'?'rtl':'ltr'}">${APP[l].pick}</span>`).join('')}</p><div class="opts">`+
    LANGS.map(l=>`<button class="opt" data-l="${l}" lang="${l==='no'?'nb':l}" dir="${l==='ar'?'rtl':'ltr'}">${NAMES[l]}</button>`).join('')+`</div></section>`;
}

function toggleBtn(key,h){ return `<button class="toggle" data-k="${key}" aria-expanded="${openSet.has(key)}"><span>${openSet.has(key)?h.less:h.more}</span><span class="chev" aria-hidden="true">▾</span></button>`; }
function screenHome(){
  const l=state.lang, h=HUI[l], a=APP[l];
  let s=`<section class="hero"><h1>${h.title}</h1><p>${h.intro}</p></section>`;
  if(h.note) s+=`<p class="note">${h.note}</p>`;
  s+=`<section class="kom${openSet.has('kom')?' open':''}"><div class="kom-head"><p class="kom-lead">${fmt(h.kom_lead)}</p><p class="kom-act">${fmt(h.kom_act)}</p></div>`+
     toggleBtn('kom',h)+`<div class="details"><div class="block"><h3>${h.kom_more}</h3><p>${fmt(h.kom_one)}</p><ul>${h.kom_list.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div></div></section>`;
  s+=`<ol class="points">`+POINTS[l].map((p,i)=>{
    let d=`<div class="block"><h3>${h.why}</h3><p class="quote">${fmt(p.why)}</p></div><div class="block"><h3>${h.pit}</h3><p>${fmt(p.pit)}</p></div>`;
    d+= p.steps ? `<div class="block do"><h3>${h.do}</h3><ol>${p.steps.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol></div>`
                : `<div class="block do"><h3>${h.do}</h3><p>${fmt(p.do)}</p></div>`;
    if(p.now) d+=`<div class="cols"><div class="block"><h3>${h.now}</h3><ul>${p.now.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div><div class="block"><h3>${h.wait}</h3><ul>${p.wait.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div></div>`;
    if(p.bank_pit) d+=`<div class="block next"><h3>${h.bank_label}</h3><p><b>${h.pit}:</b> ${fmt(p.bank_pit)}</p><p><b>${h.do}:</b> ${fmt(p.bank_do)}</p></div>`;
    if(p.help) d+=`<div class="block"><h3>${h.help}</h3><p>${fmt(p.help)}</p></div>`;
    return `<li class="point${openSet.has(i)?' open':''}"><div class="point-head"><span class="num">${i+1}</span><h2>${fmt(p.title)}</h2><p>${fmt(p.short_why)}</p><p class="short-do">${fmt(p.short_do)}</p></div>${toggleBtn(i,h)}<div class="details">${d}</div></li>`;
  }).join('')+`</ol>`;
  s+= state.answered
    ? `<section class="cta"><p>${a.cta_sub}</p><a href="#liste">${a.cta_cont} ${fwd()}</a><a class="sec" href="#sporsmal">${CUI[l].change}</a></section>`
    : `<section class="cta"><p>${a.cta_sub}</p><a href="#sporsmal">${a.cta} ${fwd()}</a></section>`;
  s+=`<section class="share"><p>${h.share_q}</p><button id="shareHome">${h.share_btn}</button></section>`;
  return s;
}

function screenQuestions(){
  const l=state.lang, w=CUI[l].w, a=APP[l];
  const q=(label,key,opts)=>`<div class="q"><h2>${label}</h2><div class="opts">${opts.map(([v,t])=>
     `<button class="opt" data-k="${key}" data-v="${v}" aria-pressed="${state[key]===v}">${t}</button>`).join('')}</div></div>`;
  return `<a class="backlink" href="#hjem">${bwd()} ${a.back}</a><section class="welcome"><h1>${a.q_title}</h1><p>${a.q_sub}</p>`+
    q(w.q1,'arrived',[['no',w.a1no],['yes',w.a1yes]])+
    q(w.q2,'kids',[['yes',w.a2yes],['no',w.a2no]])+
    q(w.q3,'housing',[['yes',w.a3yes],['no',w.a3no]])+
    `<button class="start" id="start" ${state.arrived&&state.kids&&state.housing?'':'disabled'}>${w.start}</button></section>`;
}

function itemVisible(it){ return !(it.kids && state.kids==='no') && !(it.housing && state.housing==='yes'); }
function phases(){
  return DATA[state.lang].map((p,idx)=>({...p, idx, items:p.items.filter(itemVisible)}))
    .filter(p=>p.items.length && !(p.id==='before' && state.arrived==='yes'));
}
function screenList(){
  const l=state.lang, u=CUI[l], P=phases(); if(phase>=P.length) phase=0;
  const p=P[phase], allDone=p.items.every(it=>state.checked[it.id]);
  let s=`<div class="toprow"><a class="back" href="#hjem">${bwd()} ${u.back}</a><button class="sharebtn" id="shareList">${u.share}</button></div><p class="sharehint">${u.share_hint}</p>`;
  if(u.note) s+=`<p class="note">${u.note}</p>`;
  s+=`<nav class="tl" style="--n:${P.length}">`+P.map((x,i)=>{
    const done=x.items.every(it=>state.checked[it.id]);
    const cls=[x.id==='key'?'key':'', done?'done':'', i===phase?'active':''].join(' ');
    const dot=done&&i!==phase?'<svg width="12" height="10" viewBox="0 0 12 10"><path d="M1 5L4.5 8.5L11 1.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':(i+1);
    return `<button class="${cls}" data-i="${i}"><span class="dot">${dot}</span><span class="lbl">${x.short}</span></button>`;
  }).join('')+`</nav>`;
  s+=`<div class="ph-head"><h2>${p.title}</h2><p>${p.sub}</p>${allDone?`<p class="ph-done">${u.phase_done}</p>`:''}</div><div class="list">`;
  p.items.forEach(it=>{
    const done=!!state.checked[it.id];
    const generic=['alle','everyone','iedereen','الجميع','herkes'].includes((it.for||'').toLowerCase());
    let body=`<div><h3>${u.why}</h3><p>${fmt(it.why)}</p></div>`;
    if(it.need && it.need!=='—') body+=`<div><h3>${u.need}</h3><p>${fmt(it.need)}</p></div>`;
    if(it.pit) body+=`<div><h3>${u.pit}</h3><p>${fmt(it.pit)}</p></div>`;
    if(it.steps) body+=`<div class="do"><h3>${u.do}</h3><ol>${it.steps.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol></div>`;
    else if(it.do) body+=`<div class="do"><h3>${u.do}</h3><p>${fmt(it.do)}</p></div>`;
    else if(it.desc) body+=`<p>${fmt(it.desc)}</p>`;
    if(it.help) body+=`<div><h3>${u.help}</h3><p>${fmt(it.help)}</p></div>`;
    if(it.stuck) body+=`<div class="stuck"><h3>${u.stuck}</h3><p>${fmt(it.stuck)}</p></div>`;
    if(it.call){
      let no='';
      if(it.svc && l!=='no'){
        const src=DATA.no[p.idx].items.find(x=>x.id===it.id);
        const q=src&&(src.call.match(/«([^»]+)»/)||[])[1];
        if(q) no=`<div class="callno"><h3>${u.call_no}</h3><div lang="nb" dir="ltr">«${q}»</div></div>`;
      }
      body+=`<div class="callbox"><h3>${u.call}</h3><p>${fmt(it.call)}</p>${no}</div>`;
    }
    if(it.link) body+=`<a class="link" href="${it.link}" target="_blank" rel="noopener">${u.open} ${fwd()}</a>`;
    s+=`<details class="item${done?' done':''}" data-id="${it.id}"><summary>
        <button class="cb" aria-label="${u.badge.done}" aria-pressed="${done}"><svg width="12" height="9" viewBox="0 0 12 9"><path d="M1 4L4.5 7.5L11 1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="meta"><div class="t">${fmt(it.title)}</div><div class="sub"><span class="badge ${done?'done':it.type}">${done?u.badge.done:u.badge[it.type]}</span>${generic?'':`<span class="for">${fmt(it.for)}</span>`}<span class="when">${fmt(it.when)}</span></div></div>
        <span class="chev" aria-hidden="true">▾</span></summary><div class="body">${body}</div></details>`;
  });
  s+=`</div><div class="nav"><button id="prev" ${phase===0?'disabled':''}>${u.prev}</button><button class="next" id="next" ${phase===P.length-1?'disabled':''}>${u.next}</button></div>`;
  return s;
}

function render(){
  const r=route(); chrome(r);
  const el=document.getElementById('screen');
  if(r==='sprak'){
    el.innerHTML=screenLang();
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ state.lang=b.dataset.l; save(); go('hjem'); });
  } else if(r==='hjem'){
    el.innerHTML=screenHome();
    el.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{ const k=b.dataset.k==='kom'?'kom':+b.dataset.k; openSet.has(k)?openSet.delete(k):openSet.add(k); render(); });
    const sb=document.getElementById('shareHome'), h=HUI[state.lang];
    sb.onclick=()=>share(sb, h.share_btn, h.copied, h.title);
  } else if(r==='sporsmal'){
    el.innerHTML=screenQuestions();
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ state[b.dataset.k]=b.dataset.v; save(); render(); });
    document.getElementById('start').onclick=()=>{ state.answered=true; phase=0; save(); go('liste'); };
  } else {
    el.innerHTML=screenList();
    el.querySelectorAll('.tl button').forEach(b=>b.onclick=()=>{ phase=+b.dataset.i; render(); });
    el.querySelectorAll('details.item').forEach(d=>{
      const id=d.dataset.id;
      d.querySelector('.cb').onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); if(state.checked[id]) delete state.checked[id]; else state.checked[id]=true; save(); render(); };
      d.querySelector('summary').onclick=(e)=>{ if(state.checked[id]) e.preventDefault(); };
    });
    document.getElementById('prev').onclick=()=>{ phase--; render(); window.scrollTo(0,0); };
    document.getElementById('next').onclick=()=>{ phase++; render(); window.scrollTo(0,0); };
    const sb=document.getElementById('shareList'), u=CUI[state.lang];
    sb.onclick=()=>share(sb, u.share, u.copied, HUI[state.lang].title);
  }
}
document.getElementById('change').onclick=()=>go('sporsmal');
document.getElementById('restart').onclick=()=>{
  if(!confirm(CUI[state.lang].confirm)) return;
  state={lang:state.lang, arrived:null, kids:null, housing:null, answered:false, checked:{}}; save(); go('hjem');
};
render();
</script>
</body>
</html>
