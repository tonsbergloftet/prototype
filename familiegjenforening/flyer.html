<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@oslokommune/punkt-css@16.18.0/dist/css/pkt.min.css">
<title>Flyer – Tre ting du bør vite</title>
<style>
  :root { --navy:#013952; --green:#c5daaf; --green-dark:#00714e; --bg:#F7F5F1; --ink:#1C2E3A; --muted:#5F6A70; --line:#E7E3DC;
          --card-shadow: 0 1px 3px rgba(1,57,82,.07), 0 4px 12px rgba(1,57,82,.04); }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Barlow', system-ui, sans-serif; }
  body { background:var(--bg); color:var(--ink); line-height:1.5; -webkit-text-size-adjust:100%; }
  a { color:var(--navy); text-underline-offset:2px; }
  .qa { background:#FFE9A8; color:#5C4300; font-size:.75em; font-weight:600; padding:0 .3em; border-radius:4px; white-space:nowrap; margin-inline-start:.25em; }
  .ph { background:#E6EEF3; color:var(--navy); font-weight:600; padding:0 .3em; border-radius:4px; }
  body.hide-qa .qa { display:none; }
  body:not(.hide-qa) .tf { background:#E6EEF3; border-radius:4px; padding:0 .25em; }
  .lang-sw { display:flex; gap:2px; background:#ECE7DE; border-radius:999px; padding:3px; }
  .lang-sw button { border:none; background:transparent; font:600 .8125rem 'Barlow',sans-serif; color:#6E655A; padding:.3rem .75rem; border-radius:999px; cursor:pointer; }
  .lang-sw button[aria-pressed=true] { background:var(--green-dark); color:#fff; }

  [hidden] { display:none !important; }
  @page { size: A4; margin: 0; }
  body { background:#E9E5DD; }
  .toolbar { max-width:210mm; margin:1rem auto; display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; font-size:.875rem; }
  .toolbar .print { border:none; background:var(--navy); color:#fff; font:600 .875rem 'Barlow',sans-serif; padding:.5rem 1.1rem; border-radius:999px; cursor:pointer; }
  .toolbar .warn { flex-basis:100%; background:#FFF6DD; padding:.5rem .75rem; border-radius:8px; color:#5C4300; }
  .inner { display:flex; flex-direction:column; height:100%; }
  .sheet { width:210mm; height:297mm; margin:0 auto 2rem; background:var(--bg); box-shadow:0 2px 10px rgba(0,0,0,.08);
           padding:16mm 16mm 14mm; display:flex; flex-direction:column; overflow:hidden; }
  .muni { display:flex; align-items:center; gap:3mm; font-weight:600; color:var(--navy); font-size:11pt; }
  .muni::before { content:''; width:1.4mm; height:7mm; border-radius:1mm; background:var(--green-dark); }
  h1 { font-size:30pt; line-height:1.08; color:var(--navy); letter-spacing:-.4px; margin:7mm 0 3mm; }
  .intro { font-size:12.5pt; color:var(--muted); max-width:160mm; margin-bottom:6mm; }
  .kom { background:#E4EEDC; border-radius:4mm; padding:4.5mm 7mm; margin-bottom:5mm; font-size:12pt; }
  .kom b { color:var(--navy); font-size:13pt; display:block; margin-bottom:1mm; }
  .pts { list-style:none; display:flex; flex-direction:column; gap:4mm; flex:1; }
  .pt { background:#fff; border-radius:5mm; padding:5mm 7mm; display:grid; grid-template-columns:13mm 1fr; column-gap:5mm; box-shadow:0 0.3mm 1.2mm rgba(1,57,82,.08); }
  .n { width:12mm; height:12mm; border-radius:50%; background:var(--green); color:var(--navy); font-weight:700; font-size:17pt; display:flex; align-items:center; justify-content:center; grid-row:span 3; }
  .pt h2 { font-size:17pt; line-height:1.2; color:var(--navy); margin-bottom:1.5mm; }
  .pt .w { font-size:12pt; margin-bottom:2.5mm; }
  .pt .d { font-size:12pt; color:var(--green-dark); }
  .pt .d b { font-weight:700; }
  .bottom { margin-top:7mm; display:grid; grid-template-columns:36mm 1fr; gap:6mm; align-items:center; }
  .qr { width:36mm; height:36mm; background:#fff; padding:2mm; border-radius:2mm; }
  .qr svg { width:100%; height:100%; display:block; }
  .scan { font-size:13pt; font-weight:600; color:var(--navy); margin-bottom:1.5mm; }
  .url { font-size:9.5pt; color:var(--muted); word-break:break-all; margin-bottom:2mm; }
  .disc { font-size:9.5pt; color:var(--muted); }
  @media print {
    body { background:none; }
    .toolbar { display:none; }
    .sheet { margin:0; box-shadow:none; }
  }
  @media screen and (max-width:820px) {
    .sheet { transform-origin:top center; zoom: .5; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="lang-sw" role="group" aria-label="Språk">
    <button data-l="no">Norsk</button><button data-l="en">English</button><button data-l="ar">العربية</button>
  </div>
  <button class="print" onclick="window.print()">Skriv ut / lagre som PDF</button>
  <div class="warn" id="warn" hidden></div>
</div>
<main class="sheet"><div class="inner" id="inner">
  <div class="muni" id="muni"></div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="kom" id="kom"></div>
  <ol class="pts" id="pts"></ol>
  <div class="bottom">
    <div class="qr" id="qr"></div>
    <div>
      <p class="scan" id="scan"></p>
      <p class="url" id="url"></p>
      <p class="disc" id="disc"></p>
    </div>
  </div>
</div></main>

: "Dit kunnen jullie nu doen", "wait": "Dit moet wachten op het identificatienummer", "more": "Lees meer", "less": "Minder tonen", "disclaimer": "Vervangt geen officiële informatie van UDI, NAV of de gemeente.", "proto": "Prototype – nog geen officiële dienst", "note": "Deze tekst is met hulp van AI uit het Noors vertaald en niet gecontroleerd door een vertaler. Er kan iets fout of onduidelijk zijn. Twijfel je? Vraag het dan aan de dienst waar het over gaat.", "kom_lead": "De gemeente heeft geen vaste contactpersoon voor gezinnen die komen, en niet alles gaat vanzelf.", "kom_act": "Jij, die hier al woont, neemt op het juiste moment contact op met de juiste plek. In de lijst krijg je advies over wie en wanneer. Maar eerst: dit zijn de drie belangrijkste dingen om te doen.", "kom_more": "Met wie neem je contact op, en wanneer?", "kom_one": "Dit zijn de belangrijkste plekken, in de volgorde waarin ze meestal nodig zijn:{QA}", "kom_list": ["<b>Tønsberg legekontor</b> – eerste gezondheidscheck en tuberculoseonderzoek. Direct na aankomst. 33 29 25 99 (8.30–11.30 en 12.45–14.00)", "<b>Re helsestasjon</b> – voor kinderen en gezinnen, met extra ervaring met gezinnen die nieuw zijn in Noorwegen. In de eerste weken. 33 40 69 40", "<b>Tønsberg læringssenter</b> (leercentrum) – of jullie recht hebben op het introductieprogramma en Noorse les. In de eerste weken. 33 40 68 00", "<b>NOVA op Byskogen skole</b> – onderwijs voor leerlingen in leerjaar 3–10 die nieuw zijn in Noorwegen. Zo snel mogelijk. Vraag naar NOVA via 33 40 60 00", "<b>Åpen barnehage</b>, Familiehuset, Stenmalveien 2B – hulp bij het aanvragen van een plek in de kinderopvang. Maandag en woensdag 9–15 uur"], "bank_label": "De volgende flessenhals: bank en BankID", "share_q": "Ken je iemand die op zijn of haar gezin wacht? Deel deze pagina.", "share_btn": "Pagina delen", "copied": "Link gekopieerd", "og_desc": "", "kom_flyer": ""}};
const POINTS={"no": [{"title": "Bestill time hos politiet tidlig", "short_why": "Fødselsnummer er første steg, og det kommer først etter timen hos politiet. Bank og BankID tar ofte tid etterpå.{QA}", "short_do": "Bestill time så tidlig som mulig, gjerne før familien kommer.", "why": "Vi ventet lenge på fødselsnummer, og uten det sto nesten alt stille.", "pit": "Mange venter med å bestille time til familien er i Norge. Da kan ventetiden bli lang, fordi det ofte er få ledige timer.{QA}", "do": "Les brevet fra UDI. Der står det om dere må bestille time selv, og hvem som må møte. Bestill time her: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Usikker på hva brevet betyr? Ring politiet på [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Mens dere venter på fødselsnummer", "short_why": "Bank, BankID, fastlege og søknader på nett må vente til fødselsnummeret er på plass.{QA}", "short_do": "Sett navnene til alle i familien på postkassen, så brevet med fødselsnummeret kommer fram.{QA}", "why": "Det føltes som om vi ikke kunne gjøre noe før nummeret kom.", "pit": "Navnene står ikke på postkassen, så viktige brev kommer ikke fram.{QA}", "do": "Sett navnene på postkassen i dag. Bruk så ventetiden på det som ikke trenger fødselsnummer.", "now": ["Kontakte skolen hvis dere har barn i skolealder", "Bruke legevakten (116 117) og helsestasjonen for barn under 6 år{QA}", "Spørre læringssenteret om norskopplæring", "Samle viktige papirer og ta bilder av dem"], "wait": ["Bankkonto og BankID", "Fastlege", "Barnetrygd og de fleste søknader på nett"], "bank_pit": "Banken kan be om flere dokumenter, og det kan ta tid før BankID er klar.{QA}", "bank_do": "Bestill time i banken så snart fødselsnummeret er kommet, og spør hvilke dokumenter dere må ha med.{QA}"}, {"title": "Bolig: start letingen tidlig", "short_why": "Det er vanskelig å finne en bolig som er stor nok, og køen for kommunal bolig er ofte lang.{QA}", "short_do": "Let selv samtidig som dere står i kø, og be om hjelp med språket hvis dere trenger det.", "why": "Vi bodde for trangt, og det var vanskelig å lete etter bolig uten å kunne norsk.", "pit": "Mange venter bare på kommunal bolig. Det kan ta lang tid, så det lønner seg å lete selv samtidig.{QA}", "steps": ["Se etter utleieboliger på finn.no. Et oversettelsesprogram kan hjelpe deg å lese annonsene.", "Søk om kommunal bolig samtidig: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Sjekk om dere kan få bostøtte: [[LENKE: bostøtte]]{QA}", "Trenger dere hjelp med språket, for eksempel for å ringe en utleier? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "en": [{"title": "Book a police appointment early", "short_why": "The ID number (fødselsnummer) is the first step, and it only comes after the police appointment. A bank account and BankID often take time after that.{QA}", "short_do": "Book an appointment as early as possible, ideally before the family arrives.", "why": "We waited a long time for the ID number, and without it almost everything was on hold.", "pit": "Many people wait to book until the family is in Norway. The wait can then be long, because there are often few available appointments.{QA}", "do": "Read the letter from UDI. It says whether you need to book an appointment yourselves and who has to attend. Book here: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Not sure what the letter means? Call the police on [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "While you wait for the ID number", "short_why": "A bank account, BankID, a GP and online applications have to wait until the ID number is in place.{QA}", "short_do": "Put the names of everyone in the family on the letterbox, so the letter with the ID number reaches you.{QA}", "why": "It felt like we couldn't do anything until the number came.", "pit": "The names are not on the letterbox, so important letters don't arrive.{QA}", "do": "Put the names on the letterbox today. Then use the waiting time for things that don't need an ID number.", "now": ["Contact the school if you have school-age children", "Use the out-of-hours medical service (legevakt, 116 117) and the child health clinic (helsestasjon) for children under 6{QA}", "Ask the learning centre about Norwegian classes", "Collect important documents and take photos of them"], "wait": ["Bank account and BankID", "GP (fastlege)", "Child benefit and most online applications"], "bank_pit": "The bank may ask for several documents, and it can take time before BankID is ready.{QA}", "bank_do": "Book an appointment at the bank as soon as the ID number arrives, and ask which documents to bring.{QA}"}, {"title": "Housing: start looking early", "short_why": "It is hard to find a home that is big enough, and the queue for municipal housing is often long.{QA}", "short_do": "Look for a home yourselves while you wait in the queue, and ask for help with the language if you need it.", "why": "We lived in too small a space, and it was hard to look for a home without speaking Norwegian.", "pit": "Many people only wait for municipal housing. That can take a long time, so it pays to look yourselves at the same time.{QA}", "steps": ["Look for homes to rent on finn.no. A translation app can help you read the ads.", "Apply for municipal housing at the same time: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Check whether you can get housing allowance (bostøtte): [[LENKE: bostøtte]]{QA}", "Need help with the language, for example to call a landlord? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "ar": [{"title": "احجز موعداً لدى الشرطة مبكراً", "short_why": "رقم الهوية النرويجي (fødselsnummer) هو الخطوة الأولى، ولا يصدر إلا بعد موعد الشرطة. وغالباً ما يستغرق الحساب البنكي وBankID وقتاً بعد ذلك.{QA}", "short_do": "احجز الموعد في أقرب وقت ممكن، ويُفضَّل قبل وصول العائلة.", "why": "انتظرنا طويلاً للحصول على رقم الهوية، ومن دونه توقّف كل شيء تقريباً.", "pit": "كثيرون ينتظرون وصول العائلة إلى النرويج قبل حجز الموعد. وقد يطول الانتظار حينها، لأن المواعيد المتاحة قليلة في أغلب الأحيان.{QA}", "do": "اقرأ رسالة UDI. ستجد فيها ما إذا كان عليكم حجز الموعد بأنفسكم، ومن يجب أن يحضر. احجز الموعد هنا: [[LENKE: timebestilling hos politiet]]{QA}", "help": "لست متأكداً مما تعنيه الرسالة؟ اتصل بالشرطة على [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "أثناء انتظار رقم الهوية", "short_why": "الحساب البنكي وBankID والطبيب العام والطلبات عبر الإنترنت يجب أن تنتظر حتى يصدر رقم الهوية.{QA}", "short_do": "اكتبوا أسماء جميع أفراد العائلة على صندوق البريد، حتى تصلكم رسالة رقم الهوية.{QA}", "why": "شعرنا وكأننا لا نستطيع فعل أي شيء قبل وصول الرقم.", "pit": "الأسماء غير مكتوبة على صندوق البريد، فلا تصل الرسائل المهمة.{QA}", "do": "اكتبوا الأسماء على صندوق البريد اليوم. ثم استفيدوا من وقت الانتظار في الأمور التي لا تحتاج إلى رقم الهوية.", "now": ["التواصل مع المدرسة إذا كان لديكم أطفال في سن المدرسة", "استخدام الطوارئ الطبية (legevakt) على 116 117 ومركز صحة الطفل (helsestasjon) للأطفال دون 6 سنوات{QA}", "السؤال في مركز التعلّم عن دروس اللغة النرويجية", "جمع الوثائق المهمة وتصويرها"], "wait": ["الحساب البنكي وBankID", "الطبيب العام (fastlege)", "إعانة الأطفال ومعظم الطلبات عبر الإنترنت"], "bank_pit": "قد يطلب البنك عدة وثائق، وقد يستغرق تجهيز BankID بعض الوقت.{QA}", "bank_do": "احجزوا موعداً في البنك فور وصول رقم الهوية، واسألوا عن الوثائق التي يجب إحضارها.{QA}"}, {"title": "السكن: ابدأوا البحث مبكراً", "short_why": "من الصعب إيجاد مسكن كبير بما يكفي، وقائمة الانتظار للسكن البلدي طويلة في الغالب.{QA}", "short_do": "ابحثوا بأنفسكم أثناء انتظاركم في القائمة، واطلبوا المساعدة في اللغة إذا احتجتم إليها.", "why": "كنا نعيش في مكان ضيق، وكان البحث عن مسكن صعباً من دون معرفة اللغة النرويجية.", "pit": "كثيرون يكتفون بانتظار السكن البلدي. قد يستغرق ذلك وقتاً طويلاً، لذا من الأفضل البحث بأنفسكم في الوقت نفسه.{QA}", "steps": ["ابحثوا عن مساكن للإيجار على موقع finn.no. يمكن لتطبيق ترجمة أن يساعدكم على قراءة الإعلانات.", "قدّموا طلباً للسكن البلدي في الوقت نفسه: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "تحقّقوا مما إذا كان يحق لكم الحصول على دعم السكن (bostøtte): [[LENKE: bostøtte]]{QA}", "هل تحتاجون إلى مساعدة في اللغة، مثلاً للاتصال بمؤجّر؟ [[STED: hvor man kan få språkhjelp]]{QA}"]}], "tr": [{"title": "Polisten erken randevu alın", "short_why": "Kimlik numarası (fødselsnummer) ilk adımdır ve ancak polis randevusundan sonra verilir. Banka hesabı ve BankID de çoğu zaman sonrasında zaman alır.{QA}", "short_do": "Mümkün olduğunca erken, tercihen aile gelmeden önce randevu alın.", "why": "Kimlik numarasını uzun süre bekledik ve o olmadan neredeyse her şey durdu.", "pit": "Birçok kişi randevu almak için ailenin Norveç'e gelmesini bekler. O zaman bekleme süresi uzayabilir, çünkü boş randevu genellikle azdır.{QA}", "do": "UDI'nin mektubunu okuyun. Randevuyu sizin alıp almayacağınız ve kimlerin gelmesi gerektiği mektupta yazar. Randevuyu buradan alın: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Mektubun ne anlama geldiğinden emin değil misiniz? Polisi arayın: [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Kimlik numarasını beklerken", "short_why": "Banka, BankID, aile hekimi ve internet başvuruları kimlik numarası gelene kadar beklemek zorunda.{QA}", "short_do": "Kimlik numarasının yazdığı mektubun ulaşması için ailedeki herkesin adını posta kutusuna yazın.{QA}", "why": "Numara gelene kadar hiçbir şey yapamıyormuşuz gibi hissettik.", "pit": "İsimler posta kutusunda yazmıyor, bu yüzden önemli mektuplar ulaşmıyor.{QA}", "do": "İsimleri bugün posta kutusuna yazın. Sonra bekleme süresini kimlik numarası gerektirmeyen işler için kullanın.", "now": ["Okul çağında çocuğunuz varsa okulla iletişime geçmek", "Acil sağlık hizmetini (legevakt, 116 117) ve 6 yaşından küçük çocuklar için çocuk sağlığı merkezini (helsestasjon) kullanmak{QA}", "Öğrenim merkezine Norveççe kurslarını sormak", "Önemli belgeleri toplayıp fotoğraflarını çekmek"], "wait": ["Banka hesabı ve BankID", "Aile hekimi (fastlege)", "Çocuk yardımı ve internet başvurularının çoğu"], "bank_pit": "Banka birçok belge isteyebilir ve BankID'nin hazır olması zaman alabilir.{QA}", "bank_do": "Kimlik numarası gelir gelmez bankadan randevu alın ve hangi belgeleri getirmeniz gerektiğini sorun.{QA}"}, {"title": "Konut: aramaya erken başlayın", "short_why": "Yeterince büyük bir ev bulmak zordur ve belediye konutu sırası genellikle uzundur.{QA}", "short_do": "Sırada beklerken kendiniz de arayın ve gerekirse dil konusunda yardım isteyin.", "why": "Çok dar bir yerde yaşıyorduk ve Norveççe bilmeden ev aramak zordu.", "pit": "Birçok kişi yalnızca belediye konutunu bekler. Bu uzun sürebilir; bu yüzden aynı anda kendiniz de aramanız faydalı olur.{QA}", "steps": ["finn.no'da kiralık ev arayın. İlanları okumak için bir çeviri uygulaması kullanabilirsiniz.", "Aynı anda belediye konutu için başvurun: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Konut yardımı (bostøtte) alıp alamayacağınızı kontrol edin: [[LENKE: bostøtte]]{QA}", "Dil konusunda yardıma mı ihtiyacınız var, örneğin bir ev sahibini aramak için? [[STED: hvor man kan få språkhjelp]]{QA}"]}], "nl": [{"title": "Maak vroeg een afspraak bij de politie", "short_why": "Het identificatienummer (fødselsnummer) is de eerste stap, en je krijgt het pas na de afspraak bij de politie. Een bankrekening en BankID kosten daarna vaak ook tijd.{QA}", "short_do": "Maak zo vroeg mogelijk een afspraak, het liefst voordat het gezin komt.", "why": "We hebben lang op het identificatienummer gewacht, en zonder dat lag bijna alles stil.", "pit": "Veel mensen wachten met boeken tot het gezin in Noorwegen is. Dan kan de wachttijd lang worden, omdat er vaak weinig afspraken vrij zijn.{QA}", "do": "Lees de brief van UDI. Daarin staat of jullie zelf een afspraak moeten maken en wie er moet komen. Maak hier een afspraak: [[LENKE: timebestilling hos politiet]]{QA}", "help": "Weet je niet zeker wat de brief betekent? Bel de politie: [[TELEFON: politiet, utlendingsavdelingen]]."}, {"title": "Terwijl jullie wachten op het identificatienummer", "short_why": "Bank, BankID, huisarts en online aanvragen moeten wachten tot het identificatienummer er is.{QA}", "short_do": "Zet de namen van alle gezinsleden op de brievenbus, zodat de brief met het identificatienummer aankomt.{QA}", "why": "Het voelde alsof we niets konden doen totdat het nummer kwam.", "pit": "De namen staan niet op de brievenbus, waardoor belangrijke brieven niet aankomen.{QA}", "do": "Zet de namen vandaag op de brievenbus. Gebruik de wachttijd daarna voor dingen waarvoor geen identificatienummer nodig is.", "now": ["Contact opnemen met de school als jullie schoolgaande kinderen hebben", "De huisartsenpost (legevakt, 116 117) en het consultatiebureau (helsestasjon) voor kinderen onder de 6 gebruiken{QA}", "Het leercentrum vragen naar Noorse les", "Belangrijke documenten verzamelen en fotograferen"], "wait": ["Bankrekening en BankID", "Huisarts (fastlege)", "Kinderbijslag en de meeste online aanvragen"], "bank_pit": "De bank kan om meerdere documenten vragen, en het kan even duren voordat BankID klaar is.{QA}", "bank_do": "Maak een afspraak bij de bank zodra het identificatienummer er is, en vraag welke documenten je moet meenemen.{QA}"}, {"title": "Woning: begin vroeg met zoeken", "short_why": "Het is moeilijk om een woning te vinden die groot genoeg is, en de wachtlijst voor een gemeentewoning is vaak lang.{QA}", "short_do": "Zoek zelf terwijl jullie op de wachtlijst staan, en vraag hulp met de taal als dat nodig is.", "why": "We woonden te klein, en het was moeilijk om zonder Noors een woning te zoeken.", "pit": "Veel mensen wachten alleen op een gemeentewoning. Dat kan lang duren, dus het loont om tegelijk zelf te zoeken.{QA}", "steps": ["Zoek huurwoningen op finn.no. Een vertaalapp kan helpen om de advertenties te lezen.", "Vraag tegelijk een gemeentewoning aan: [[LENKE: søknad om kommunal bolig i Tønsberg]]{QA}", "Check of jullie huurtoeslag (bostøtte) kunnen krijgen: [[LENKE: bostøtte]]{QA}", "Hulp nodig met de taal, bijvoorbeeld om een verhuurder te bellen? [[STED: hvor man kan få språkhjelp]]{QA}"]}]};

const FILL_TXT={"KONTAKT: kontaktpunkt i kommunen": "Tønsberg kommune: 33 40 60 00 (09–15)", "LENKE: timebestilling hos politiet": "udi.no/timebestilling", "TELEFON: politiet, utlendingsavdelingen": "33 34 44 00 (Tønsberg politistasjon)", "LENKE: søknad om kommunal bolig i Tønsberg": "tonsberg.kommune.no", "LENKE: bostøtte": "husbanken.no/bostotte", "STED: hvor man kan få språkhjelp": "Tønsberg bibliotek, Storgata 16: 33 34 86 20", "KONTAKT: hjelp med bank og BankID": "Tønsberg kommune: 33 40 60 00 (09–15)", "KONTAKT: hjelp med fastlege": "Helsenorge veiledning: 23 32 70 00", "KONTAKT: barnehageopptak i kommunen": "tonsberg.kommune.no/barnehage"};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmt(s){
  return esc(s)
    .replace(/\{QA\}/g,'<span class="qa" lang="nb" dir="ltr">[MÅ KVALITETSSIKRES]</span>')
    .replace(/\[\[([^\]]+)\]\]/g,(m,t)=>FILL_TXT[t]?'<span class="tf" dir="ltr">'+esc(FILL_TXT[t])+'</span>':'<span class="ph" lang="nb" dir="ltr">['+t+']</span>')
    .replace(/(\d[\d ]*\d)/g,'<span dir="ltr">$1</span>');
}
const params=new URLSearchParams(location.search);
if(params.get('qa')!=='1') document.body.classList.add('hide-qa');
function initialLang(allowed){ const l=params.get('lang'); return allowed.includes(l)?l:allowed[0]; }
function setUrlLang(l){ const p=new URLSearchParams(location.search); p.set('lang',l); history.replaceState(null,'','?'+p.toString()); }
function carry(l){ const p=new URLSearchParams(); p.set('lang',l); if(params.get('qa')==='1') p.set('qa','1'); return '?'+p.toString(); }
const LANDING_FILE={no:'landingsside.html',en:'landingsside-en.html',ar:'landingsside-ar.html'};
function carryQa(){ return params.get('qa')==='0'?'?qa=0':''; }

let lang=initialLang(["no", "en", "ar"]);
// The QR code points to veileder.html (the app) next to this file. Override with ?url=https://… (base address of the published pages).
function landingUrl(){
  const base=params.get('url');
  return new URL('veileder.html'+carry(lang), base ? (base.endsWith('/')?base:base+'/') : location.href).href;
}
function render(){
  const u=UI[lang];
  document.documentElement.lang = lang==='no'?'nb':lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.getElementById('muni').textContent=u.muni;
  document.getElementById('title').textContent=u.title;
  document.getElementById('intro').textContent=u.intro;
  document.getElementById('kom').innerHTML=`<b>${fmt(u.kom_lead)}</b>${fmt(u.kom_flyer||u.kom_act)}`;
  document.getElementById('scan').textContent=u.flyer_scan;
  document.getElementById('disc').textContent=u.disclaimer+' '+u.proto+'.';
  document.querySelectorAll('.lang-sw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===lang));
  document.getElementById('pts').innerHTML=POINTS[lang].map((p,i)=>
    `<li class="pt"><span class="n">${i+1}</span><h2>${fmt(p.title)}</h2><p class="w">${fmt(p.short_why)}</p><p class="d"><b>${u.flyer_do}</b> ${fmt(p.short_do)}</p></li>`).join('');
  const url=landingUrl();
  const q=qrcode(0,'M'); q.addData(url); q.make();
  document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4, margin:0, scalable:true});
  const online=/^https?:/.test(url);
  document.getElementById('url').textContent= online ? url.replace(/^https?:\/\//,'') : '';
  const w=document.getElementById('warn');
  w.hidden=online;
  const inner=document.getElementById('inner'), sheet=inner.parentElement;
  inner.style.zoom=1; inner.style.height='auto';
  const avail=sheet.clientHeight - parseFloat(getComputedStyle(sheet).paddingTop) - parseFloat(getComputedStyle(sheet).paddingBottom);
  if(inner.scrollHeight>avail){ inner.style.zoom=(avail/inner.scrollHeight*0.985).toFixed(3); }
  inner.style.height=(avail/parseFloat(inner.style.zoom||1))+'px';
  w.textContent='QR-koden peker nå til en fil på denne maskinen og virker ikke på telefon. Legg filene på nett (for eksempel GitHub Pages), eller legg til ?url=https://din-adresse/ i adresselinja.';
}
document.querySelectorAll('.lang-sw button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; setUrlLang(lang); render(); });
render();
</script>
